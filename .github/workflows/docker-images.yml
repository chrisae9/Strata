name: Docker images

# Builds the Strata container images of one release from its engine packages and pushes them to ghcr.io.
# The Archrig branch builds and publishes its CUDA 13 image on push. Manual runs can build other flavors.
#
# For each flavor the job downloads the engine package from the release and checks it against the signed update feed
# (tools/docker/fetch-engines.py: the feed's Ed25519 signature, the archive's SHA-256, the manifest hash, the package signature,
# every file's hash), builds the image with tools/docker/build.sh and, only when "push" is on, pushes
#   ghcr.io/<owner>/strata:<version>-<flavor>   and   ghcr.io/<owner>/strata:latest-<flavor>
# The first run with "push" off builds everything without publishing it (a dry run).

on:
  push:
    branches: [feature/replica-warm-handoff]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag whose engine packages go into the images (for example v0.2.7)'
        required: true
        type: string
      flavors:
        description: 'Flavors to build, comma separated (empty: every flavor the release has a package for)'
        required: false
        default: ''
        type: string
      push:
        description: 'Push the images to ghcr.io (off: build only, nothing is published)'
        required: true
        default: false
        type: boolean
      latest:
        description: 'Also move the latest-<flavor> tags (turn off for a pre-release or a test)'
        required: true
        default: true
        type: boolean
      source_ref:
        description: 'Git ref of the tools/docker/Dockerfile.src and the Terminal sources (empty: the release tag)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.release_tag || 'v0.2.16' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      flavors: ${{ steps.list.outputs.flavors }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Which flavors does the release have a package for
        id: list
        env:
          WANT: ${{ github.event_name == 'push' && 'cuda13' || inputs.flavors }}
        run: |
          set -eu
          args="--release-tag $TAG --list --skip-missing"
          [ -n "$WANT" ] && args="$args --flavors $WANT"
          python3 tools/docker/fetch-engines.py $args > list.tsv
          cat list.tsv
          flavors=$(awk -F'\t' '$3 != "SKIP" {printf "%s\"%s\"", (n++ ? "," : ""), $1}' list.tsv)
          [ -n "$flavors" ] || { echo "the release has no engine package for any requested flavor"; exit 1; }
          echo "flavors=[$flavors]" >> "$GITHUB_OUTPUT"

  image:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        flavor: ${{ fromJSON(needs.plan.outputs.flavors) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Free disk space (the runner has about 14 GB; a package plus its image needs about 10 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af >/dev/null 2>&1 || true
          df -h /
      - name: Build the image from this checkout
        id: build
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          sha=$(git rev-parse HEAD)
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${TAG#v}-${sha:0:7}"
          export STRATA_DOCKER_BUILD_OPTS="--label org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY --label org.opencontainers.image.revision=$sha"
          tools/docker/publish.sh --release-tag "$TAG" --flavors "$FLAVOR" --image "$prefix" --version "$version" --no-latest
          echo "image=$prefix:$version-$FLAVOR" >> "$GITHUB_OUTPUT"
          echo "latest=$prefix:latest-$FLAVOR" >> "$GITHUB_OUTPUT"
      - name: Verify the packaged source and handoff behavior
        if: matrix.flavor == 'cuda13'
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          test "$(docker run --rm --network none --entrypoint cat "$IMAGE" /opt/strata/terminal/COMMIT)" = "$(git rev-parse HEAD)"
          (cd terminal && sha256sum serve/server.py serve/replicas.py serve/replica_handoff.py) |
            docker run --rm -i --network none -w /opt/strata/terminal --entrypoint sha256sum "$IMAGE" -c -
          docker run --rm --network none -w /opt/strata/terminal --entrypoint /opt/strata/terminal/python/bin/python3 "$IMAGE" -m unittest serve.test_replica_handoff
      - name: Publish the tested image
        if: github.event_name == 'push' || inputs.push
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.build.outputs.image }}
          LATEST_IMAGE: ${{ steps.build.outputs.latest }}
          MOVE_LATEST: ${{ github.event_name == 'workflow_dispatch' && inputs.latest }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          if [ "$MOVE_LATEST" = true ]; then
            docker tag "$IMAGE" "$LATEST_IMAGE"
            docker push "$LATEST_IMAGE"
          fi
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
